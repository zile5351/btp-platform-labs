name: Build and Deploy

on:
  push:
    branches:
      - master
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test
      - name: Build MTAR
        run: |
          npm install -g mbt
          mbt build -t gen --mtar app.mtar
      - name: Upload MTAR
        uses: actions/upload-artifact@v7
        with:
          name: mtar
          path: |
            app/gen/app.mtar
            app/mtaext/*.mtaext
          if-no-files-found: error
  deploy-dev:
    needs: build
    uses: ./.github/workflows/deploy-template.yml
    with:
      environment: dev
      mtaext: mtaext/dev.mtaext
      version-rule: ALL

  deploy-prod:
    needs: deploy-dev
    if: startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/deploy-template.yml
    with:
      environment: prod
      mtaext: mtaext/prod.mtaext
