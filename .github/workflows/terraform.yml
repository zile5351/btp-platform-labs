name: terraform

on:
  pull_request:
    paths:
      - "terraform/**"
      - ".github/workflows/terraform.yml"
  push:
    branches:
      - master
    paths:
      - "terraform/**"
      - ".github/workflows/terraform.yml"
  workflow_dispatch:
  schedule:
    - cron: "0 1 * * *" # Runs every day at 01:00 UTC (09:00 MYT)

permissions:
  contents: read

concurrency:
  group: terraform-dev
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  BTP_USERNAME: ${{ secrets.BTP_USERNAME }}
  BTP_PASSWORD: ${{ secrets.BTP_PASSWORD }}
  TF_VAR_globalaccount: ${{ secrets.TF_VAR_GLOBALACCOUNT }}
  TF_VAR_region: ${{ vars.TF_VAR_REGION }}
  TF_VAR_project: ${{ vars.TF_VAR_PROJECT }}
  TF_VAR_env: ${{ vars.TF_VAR_ENV }}
  TF_VAR_suffix: ${{ vars.TF_VAR_SUFFIX }}

jobs:
  plan:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v4
        with:
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}

      - name: Format check
        run: terraform fmt -check -recursive

      - name: Init
        run: terraform init -input=false

      - name: Validate
        run: terraform validate

      - name: Plan
        run: terraform plan -input=false -no-color | tee plan.txt

      - name: Publish plan to the run summary
        if: always()
        run: |
          {
             echo "### Terraform plan (dev)"
             echo '```'
             cat plan.txt
             echo '```'
           } >> "$GITHUB_STEP_SUMMARY"

  apply:
    needs: plan
    # PR: plan runs and apply is skipped, so reviewers see the plan
    # on merge to master: plan runs, then apply waits for yours approval in the terraform-dev environment. It applies on being approved by reviewer.
    if: github.ref == 'refs/heads/master' && (github.event_name != 'pull_request' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    environment: terraform-dev
    defaults:
      run:
        working-directory: terraform
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v4
        with:
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}

      - name: Init
        run: terraform init -input=false

      - name: Apply
        run: terraform apply -input=false -auto-approve -no-color

  drift:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v4
        with:
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}

      - name: Init
        run: terraform init -input=false

      - name: Check for drift
        run: |
          set +e
          terraform plan -input-false -no-color -detailed-exitcode > plan.txt
          code=$?
          set -e
          {
            echo "### Drift check (dev)"
            echo '```'
            cat plan.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$code" -eq 2 ]; then
            echo "::error::Drift detected: BTP no longer matches the Terraform code"
            exit 1
          fi
          exit "$code"
