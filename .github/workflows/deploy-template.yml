name: deploy-template

on:
  workflow_call:
    inputs:
      environment:
        description: GitHub environment to deploy to (dev or prod)
        required: true
        type: string
      mtaext:
        description: MTA extension description file for this environment
        required: true
        type: string
      version-rule:
        description: MTA version rule (SAME_HIGHER, HIGHER or ALL)
        required: false
        type: string
        default: SAME_HIGHER

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - name: Download MTAR
        uses: actions/download-artifact@v8
        with:
          name: mtar
      - name: Install cf CLI and MultiApps plugin
        run: |
          wget -q -O - https://packages.cloudfoundry.org/debian/cli.cloudfoundry.org.key | sudo gpg --dearmor -o /usr/share/keyrings/cli.cloudfoundry.org.gpg
          echo "deb [signed-by=/usr/share/keyrings/cli.cloudfoundry.org.gpg] https://packages.cloudfoundry.org/debian stable main" | sudo tee /etc/apt/sources.list.d/cloudfoundry-cli.list
          sudo apt-get update && sudo apt-get install -y cf8-cli
          cf install-plugin multiapps -f
      - name: Deploy to ${{ inputs.environment }}
        env:
          CF_API: ${{ secrets.CF_API }}
          CF_ORG: ${{ secrets.CF_ORG }}
          CF_SPACE: ${{ secrets.CF_SPACE }}
          CF_USER: ${{ secrets.CF_USER }}
          CF_PASSWORD: ${{ secrets.CF_PASSWORD }}
        run: |
          cf login -a "$CF_API" -u "$CF_USER" -p "$CF_PASSWORD" -o "$CF_ORG" -s "$CF_SPACE"
          cf deploy gen/app.mtar -f -e "${{ inputs.mtaext }}" --version-rule "${{ inputs.version-rule }}"
